version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      TZ: Europe/Kyiv
      POSTGRES_USER: savekw
      POSTGRES_PASSWORD: savekw_dev_password
      POSTGRES_DB: savekw_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savekw"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
